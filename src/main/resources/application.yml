server:
  port: 8080

logging:
  level:
    root: INFO
    org:
      springframework:
        cloud:
          gateway:  TRACE
          route:
            RouteDefinitionLocator: INFO

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:5173"
            allowed-methods: 
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true

      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/** , /api/users/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/category/** , /api/transaction/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/mail/**
        - id: deposit-service
          uri: lb://deposit-service
          predicates:
            - Path=/api/deposits/** 
        - id: discovery-server
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/web
          filters:
            - SetPath=/
        - id: discovery-server-static
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/**
      discovery:
        locator:
          enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/